project:
  type: website
  output-dir: docs
  render:                 # the website: everything except the nested Book/ project
    - "*.qmd"
    - "Lecture_Folder/**/*.qmd"
    - "Homework_Folder/**/*.qmd"
    - "!Book/**"
  post-render:
    - render_book.R   # also renders the nested Book/ project into docs/book

website:
  title: "Comp Tools Bioengineers F26"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - about.qmd
      - Syllabus.qmd
      - Schedule.qmd
      - Homework.qmd
      - Software.qmd
      - Policies.qmd
      - Resources.qmd
      - text: Book
        href: book/index.html

format:
  html:
    theme: cerulean
    css: styles.css
    toc: true

editor: visual

