<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 495" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="495" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- shared start -->
  <rect x="300" y="20" width="200" height="55" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="400" y="43" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">edit your website's</text>
  <text x="400" y="64" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">.qmd files</text>

  <!-- split -->
  <line x1="355" y1="75" x2="215" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="445" y1="75" x2="585" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Route 1: docs/ on main -->
  <rect x="85" y="110" width="250" height="60" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="210" y="136" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">quarto render</text>
  <text x="210" y="158" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">(output-dir: docs)</text>

  <line x1="210" y1="170" x2="210" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="85" y="205" width="250" height="60" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="210" y="229" font-size="13" fill="#333" text-anchor="middle">rendered site committed to</text>
  <text x="210" y="252" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">docs/ on main</text>

  <line x1="210" y1="265" x2="210" y2="295" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="285" font-size="13" font-weight="bold" fill="#333" text-anchor="start" font-family="'Courier New', monospace">git push</text>

  <rect x="85" y="300" width="250" height="70" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="210" y="326" font-size="13" fill="#333" text-anchor="middle">Pages: deploy from a branch</text>
  <text x="210" y="352" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">main · /docs</text>

  <!-- Route 2: quarto publish -->
  <rect x="465" y="110" width="250" height="60" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="590" y="136" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">quarto publish gh-pages</text>
  <text x="590" y="158" font-size="13" fill="white" text-anchor="middle">renders and pushes for you</text>

  <line x1="590" y1="170" x2="590" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="465" y="205" width="250" height="60" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="590" y="229" font-size="13" fill="white" text-anchor="middle">rendered site on the</text>
  <text x="590" y="252" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">gh-pages branch</text>

  <line x1="590" y1="265" x2="590" y2="295" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="465" y="300" width="250" height="70" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="590" y="326" font-size="13" fill="white" text-anchor="middle">Pages: deploy from a branch</text>
  <text x="590" y="352" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">gh-pages · root</text>

  <!-- converge -->
  <line x1="210" y1="370" x2="330" y2="422" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="370" x2="470" y2="422" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- shared destination -->
  <rect x="210" y="425" width="380" height="55" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="400" y="447" font-size="13" fill="white" text-anchor="middle">the same live site:</text>
  <text x="400" y="470" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">https://username.github.io/repository/</text>
</svg>
