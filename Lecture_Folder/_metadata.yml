# Shared settings for every slide deck in Lecture_Folder.
# Quarto merges this file into the YAML header of each .qmd in this folder,
# so individual lectures only need title / subtitle / date / author.
format:
  revealjs:
    theme: default
    css: cresko_style.css
    footer: "BioE Computational Tools 2026 - Knight Campus"
    transition: fade
    transition-speed: slow
    slide-number: true
    code-overflow: wrap
    highlight-style: github
execute:
  echo: true
  warning: false
  message: false
editor: visual
resources:
  - images/**
