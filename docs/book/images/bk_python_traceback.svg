<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="320" fill="white"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Terminal panel -->
  <rect x="20" y="25" width="520" height="210" fill="#c8c0b8" stroke="#a09888" rx="3"/>

  <!-- Line 1: command -->
  <text x="32" y="50" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">$ python3 analyze_expression.py</text>

  <!-- Line 2: Traceback header -->
  <text x="32" y="77" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">Traceback (most recent call last):</text>

  <!-- Your-code frame (steel blue) -->
  <rect x="28" y="89" width="504" height="48" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="36" y="106" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white">File "analyze_expression.py", line 12, in &lt;module&gt;</text>
  <text x="36" y="128" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white">  mean_expr = df["Gene_1"].mean()</text>

  <!-- Library frames (plain) -->
  <text x="32" y="160" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">  File ".../pandas/core/frame.py", line 4102, ...</text>
  <text x="32" y="182" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">    indexer = self.columns.get_loc(key)</text>

  <!-- Last line: the exception (red highlight) -->
  <rect x="28" y="196" width="168" height="24" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="36" y="213" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white">KeyError: 'Gene_1'</text>

  <!-- Callout 1: read the last line first -->
  <text x="560" y="196" font-size="14" font-weight="bold" fill="#333">1. Read the LAST line first</text>
  <text x="560" y="214" font-size="13" fill="#333">The exception type and message</text>
  <text x="560" y="230" font-size="13" fill="#333">name what went wrong.</text>
  <line x1="556" y1="208" x2="205" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Callout 2: the chain shows where -->
  <text x="560" y="98" font-size="14" font-weight="bold" fill="#333">2. The chain above shows WHERE</text>
  <text x="560" y="116" font-size="13" fill="#333">The first "File" lines are your</text>
  <text x="560" y="132" font-size="13" fill="#333">script; the rest are inside pandas.</text>
  <line x1="556" y1="110" x2="538" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Callout 3: footnote -->
  <text x="32" y="268" font-size="13" fill="#333" font-weight="bold">3. The flagged line is where Python noticed the problem.</text>
  <text x="32" y="286" font-size="13" fill="#333">The real mistake (here, a typo for the column "Gene1") can sit one line above or below</text>
  <text x="32" y="302" font-size="13" fill="#333">the line the arrow points at.</text>
</svg>
