<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="310" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- keyboard (stdin source) -->
  <rect x="45" y="135" width="135" height="72" rx="8" fill="#c8c0b8" stroke="#a09888"/>
  <g fill="#ffffff" stroke="#a09888" stroke-width="1">
    <rect x="55" y="145" width="14" height="12" rx="2"/>
    <rect x="73" y="145" width="14" height="12" rx="2"/>
    <rect x="91" y="145" width="14" height="12" rx="2"/>
    <rect x="109" y="145" width="14" height="12" rx="2"/>
    <rect x="127" y="145" width="14" height="12" rx="2"/>
    <rect x="145" y="145" width="14" height="12" rx="2"/>
    <rect x="60" y="161" width="14" height="12" rx="2"/>
    <rect x="78" y="161" width="14" height="12" rx="2"/>
    <rect x="96" y="161" width="14" height="12" rx="2"/>
    <rect x="114" y="161" width="14" height="12" rx="2"/>
    <rect x="132" y="161" width="14" height="12" rx="2"/>
    <rect x="150" y="161" width="14" height="12" rx="2"/>
    <rect x="55" y="177" width="14" height="12" rx="2"/>
    <rect x="75" y="177" width="72" height="12" rx="2"/>
    <rect x="153" y="177" width="14" height="12" rx="2"/>
  </g>
  <text x="112" y="228" font-size="14" fill="#333" text-anchor="middle">keyboard</text>

  <!-- program box -->
  <rect x="330" y="110" width="140" height="120" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="400" y="176" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Program</text>

  <!-- terminal window -->
  <rect x="615" y="95" width="165" height="150" rx="6" fill="#c8c0b8" stroke="#a09888"/>
  <line x1="615" y1="121" x2="780" y2="121" stroke="#a09888" stroke-width="1"/>
  <circle cx="630" cy="108" r="4" fill="#a09888"/>
  <circle cx="643" cy="108" r="4" fill="#a09888"/>
  <circle cx="656" cy="108" r="4" fill="#a09888"/>
  <rect x="625" y="130" width="145" height="105" fill="#ffffff" stroke="#a09888"/>
  <g font-family="'Courier New', monospace" font-weight="bold" font-size="13">
    <text x="633" y="150" fill="#333">$ ls data/</text>
    <text x="633" y="170" fill="#333">samples.csv</text>
    <text x="633" y="196" fill="#c0392b">ls: no such file</text>
  </g>
  <text x="697" y="267" font-size="14" fill="#333" text-anchor="middle">terminal</text>

  <!-- stdin arrow -->
  <line x1="184" y1="171" x2="324" y2="171" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="254" y="148" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333" text-anchor="middle">stdin</text>
  <circle cx="254" cy="171" r="14" fill="#2e6da4" stroke="#1f4e79"/>
  <text x="254" y="176" font-size="15" font-weight="bold" fill="white" text-anchor="middle">0</text>

  <!-- stdout arrow -->
  <line x1="474" y1="140" x2="609" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="542" y="117" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333" text-anchor="middle">stdout</text>
  <circle cx="542" cy="140" r="14" fill="#2e6da4" stroke="#1f4e79"/>
  <text x="542" y="145" font-size="15" font-weight="bold" fill="white" text-anchor="middle">1</text>

  <!-- stderr arrow -->
  <line x1="474" y1="202" x2="609" y2="202" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="542" y="181" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#c0392b" text-anchor="middle">stderr</text>
  <circle cx="542" cy="202" r="14" fill="#c0392b" stroke="#922b21"/>
  <text x="542" y="207" font-size="15" font-weight="bold" fill="white" text-anchor="middle">2</text>

  <!-- footnote -->
  <text x="400" y="294" font-size="13" fill="#333" text-anchor="middle">The numbers 0, 1, and 2 are the streams' file descriptors.</text>
</svg>
