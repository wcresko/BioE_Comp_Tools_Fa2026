<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="400" fill="white"/>

  <!-- value cards: r=4, w=2, x=1 -->
  <rect x="150" y="32" width="150" height="40" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="325" y="32" width="150" height="40" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="500" y="32" width="150" height="40" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="225" y="57"><tspan font-family="'Courier New', monospace" font-weight="bold">r</tspan><tspan> = 4  (read)</tspan></text>
    <text x="400" y="57"><tspan font-family="'Courier New', monospace" font-weight="bold">w</tspan><tspan> = 2  (write)</tspan></text>
    <text x="575" y="57"><tspan font-family="'Courier New', monospace" font-weight="bold">x</tspan><tspan> = 1  (execute)</tspan></text>
  </g>

  <!-- column headers -->
  <g font-size="14" font-weight="bold" fill="#222" text-anchor="middle">
