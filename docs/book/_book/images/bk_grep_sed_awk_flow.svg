<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="560" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- D1 -->
  <polygon points="230,27 390,70 230,113 70,70" fill="white" stroke="#a09888" stroke-width="1.5"/>
  <text x="230" y="66" text-anchor="middle" font-size="14" fill="#333">Need to find or</text>
  <text x="230" y="84" text-anchor="middle" font-size="14" fill="#333">select lines?</text>
  <path d="M390,70 L458,70" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="424" y="62" text-anchor="middle" font-size="13" fill="#333">yes</text>
  <rect x="460" y="48" width="290" height="44" rx="8" fill="#c8c0b8" stroke="#a09888"/>
  <text x="605" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">grep -E 'pattern' file</text>

  <path d="M230,113 L230,140" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="243" y="132" font-size="13" fill="#333">no</text>

  <!-- D2 -->
  <polygon points="230,142 390,185 230,228 70,185" fill="white" stroke="#a09888" stroke-width="1.5"/>
  <text x="230" y="181" text-anchor="middle" font-size="14" fill="#333">Edit text</text>
  <text x="230" y="199" text-anchor="middle" font-size="14" fill="#333">within lines?</text>
  <path d="M390,185 L458,185" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="424" y="177" text-anchor="middle" font-size="13" fill="#333">yes</text>
  <rect x="460" y="163" width="290" height="44" rx="8" fill="#c8c0b8" stroke="#a09888"/>
  <text x="605" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">sed 's/old/new/g' file</text>

  <path d="M230,228 L230,255" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="243" y="247" font-size="13" fill="#333">no</text>

  <!-- D3 -->
  <polygon points="230,257 390,300 230,343 70,300" fill="white" stroke="#a09888" stroke-width="1.5"/>
  <text x="230" y="296" text-anchor="middle" font-size="14" fill="#333">Filter or compute</text>
  <text x="230" y="314" text-anchor="middle" font-size="14" fill="#333">by column?</text>
  <path d="M390,300 L458,300" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="424" y="292" text-anchor="middle" font-size="13" fill="#333">yes</text>
  <rect x="460" y="278" width="290" height="44" rx="8" fill="#c8c0b8" stroke="#a09888"/>
  <text x="605" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">awk 'pattern { action }' file</text>

  <path d="M230,343 L230,370" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="243" y="362" font-size="13" fill="#333">no</text>

  <!-- D4 -->
  <polygon points="230,372 390,415 230,458 70,415" fill="white" stroke="#a09888" stroke-width="1.5"/>
  <text x="230" y="411" text-anchor="middle" font-size="14" fill="#333">Count how many</text>
  <text x="230" y="429" text-anchor="middle" font-size="14" fill="#333">of each value?</text>
  <path d="M390,415 L458,415" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="424" y="407" text-anchor="middle" font-size="13" fill="#333">yes</text>
  <rect x="460" y="393" width="290" height="44" rx="8" fill="#c8c0b8" stroke="#a09888"/>
  <text x="605" y="414" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">sort | uniq -c</text>
  <text x="605" y="430" text-anchor="middle" font-size="13" fill="#333">(or an awk array)</text>

  <path d="M230,458 L230,478" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- pipeline note -->
  <rect x="70" y="480" width="660" height="60" rx="8" fill="#2e6da4" stroke="#1f4e79"/>
  <text x="400" y="503" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Several jobs at once? They chain together naturally in a pipeline:</text>
  <text x="400" y="526" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white">grep -v "^#" annotations.gff | cut -f3 | sort | uniq -c</text>
</svg>
