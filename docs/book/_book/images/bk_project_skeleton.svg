<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="420" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <!-- tree connector lines -->
  <g stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 64,64 V 386"/>
    <path d="M 64,94 H 110"/>
    <path d="M 64,218 H 110"/>
    <path d="M 64,262 H 110"/>
    <path d="M 64,386 H 110"/>
    <path d="M 124,108 V 174"/>
    <path d="M 124,134 H 170"/>
    <path d="M 124,174 H 170"/>
    <path d="M 124,276 V 342"/>
    <path d="M 124,302 H 170"/>
    <path d="M 124,342 H 170"/>
  </g>

  <!-- folder boxes -->
  <g>
    <rect x="50" y="36" width="120" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
    <rect x="110" y="80" width="65" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
    <rect x="170" y="120" width="56" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
    <rect x="170" y="160" width="110" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
    <rect x="110" y="204" width="92" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
    <rect x="110" y="248" width="83" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
    <rect x="170" y="288" width="92" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
    <rect x="170" y="328" width="83" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
    <rect x="110" y="372" width="65" height="28" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  </g>
  <g font-family="'Courier New', monospace" font-weight="bold" font-size="15" fill="#333">
    <text x="60" y="55">my_project/</text>
    <text x="120" y="99">data/</text>
    <text x="180" y="139">raw/</text>
    <text x="180" y="179">processed/</text>
    <text x="120" y="223">scripts/</text>
    <text x="120" y="267">output/</text>
    <text x="180" y="307">figures/</text>
    <text x="180" y="347">tables/</text>
    <text x="120" y="391">docs/</text>
  </g>

  <!-- lock icon and read-only tag on data/raw/ -->
  <path d="M 244,131 v -4 a 5,5 0 0 1 10,0 v 4" fill="none" stroke="#922b21" stroke-width="2"/>
  <rect x="241" y="131" width="16" height="13" rx="2" fill="#c0392b" stroke="#922b21"/>
  <rect x="268" y="120" width="92" height="28" rx="3" fill="#c0392b" stroke="#922b21"/>
  <text x="314" y="139" font-size="14" font-weight="bold" fill="white" text-anchor="middle">read-only</text>
  <text x="372" y="139" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">chmod a-w data/raw/*</text>
  <text x="268" y="162" font-size="13" fill="#333">original data, exactly as it arrived — never modify</text>

  <!-- curved arrow: scripts/ regenerate output/ -->
  <path d="M 208,218 C 400,218 400,262 199,262" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="372" y="234" font-size="14" font-weight="bold" fill="#333">regenerable — safe to delete</text>
  <text x="372" y="254" font-size="13" fill="#333">running the scripts rebuilds everything in output/</text>

  <!-- docs note -->
  <text x="192" y="391" font-size="13" fill="#333">notes, reports, manuscript drafts</text>
</svg>
