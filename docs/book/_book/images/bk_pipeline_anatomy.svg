<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="240" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- stage 1: grep -->
  <rect x="15" y="20" width="158" height="52" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="94" y="51" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">grep -v "^&gt;"</text>
  <line x1="94" y1="72" x2="94" y2="94" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="15" y="96" width="158" height="100" rx="3" fill="white" stroke="#a09888"/>
  <text x="25" y="118" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">tacggcataacc</text>
  <text x="25" y="138" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">GATTACAGATTC</text>
  <text x="25" y="158" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">acgtTACCGGTA</text>
  <text x="25" y="178" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">...</text>
  <text x="94" y="218" text-anchor="middle" font-size="13" fill="#333">sequence lines only</text>

  <path d="M173,46 L191,46" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- stage 2: tr + tr -->
  <rect x="193" y="20" width="158" height="52" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="272" y="41" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">tr 'acgtn' 'ACGTN'</text>
  <text x="272" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">| tr -d '\n'</text>
  <line x1="272" y1="72" x2="272" y2="94" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="193" y="96" width="158" height="100" rx="3" fill="white" stroke="#a09888"/>
  <text x="203" y="151" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">TACGGCATAACCGA&#8230;</text>
  <text x="272" y="218" text-anchor="middle" font-size="13" fill="#333">uppercase, one long line</text>

  <path d="M351,46 L369,46" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- stage 3: fold -->
  <rect x="371" y="20" width="158" height="52" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="450" y="51" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">fold -w1</text>
  <line x1="450" y1="72" x2="450" y2="94" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="371" y="96" width="158" height="100" rx="3" fill="white" stroke="#a09888"/>
  <text x="381" y="118" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">T</text>
  <text x="381" y="138" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">A</text>
  <text x="381" y="158" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">C</text>
  <text x="381" y="178" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">...</text>
  <text x="450" y="218" text-anchor="middle" font-size="13" fill="#333">one base per line</text>

  <path d="M529,46 L547,46" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- stage 4: sort -->
  <rect x="549" y="20" width="158" height="52" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="628" y="51" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">sort</text>
  <line x1="628" y1="72" x2="628" y2="94" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="549" y="96" width="158" height="100" rx="3" fill="white" stroke="#a09888"/>
  <text x="559" y="118" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">A</text>
  <text x="559" y="138" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">A</text>
  <text x="559" y="158" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">A</text>
  <text x="559" y="178" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">...</text>
  <text x="628" y="218" text-anchor="middle" font-size="13" fill="#333">identical bases adjacent</text>

  <path d="M707,46 L725,46" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- stage 5: uniq -c -->
  <rect x="727" y="20" width="158" height="52" rx="3" fill="#c0392b" stroke="#922b21"/>
  <text x="806" y="51" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white">uniq -c</text>
  <line x1="806" y1="72" x2="806" y2="94" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="727" y="96" width="158" height="100" rx="3" fill="white" stroke="#a09888"/>
  <text x="737" y="118" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">10290 A</text>
  <text x="737" y="138" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333"> 7395 C</text>
  <text x="737" y="158" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333"> 7484 G</text>
  <text x="737" y="178" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">    ...</text>
  <text x="806" y="218" text-anchor="middle" font-size="13" fill="#333">tally of each base</text>
</svg>
