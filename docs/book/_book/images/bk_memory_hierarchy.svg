<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="400" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <!-- pyramid levels -->
  <rect x="325" y="40" width="150" height="62" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="272" y="108" width="256" height="62" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="220" y="176" width="360" height="62" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="167" y="244" width="466" height="62" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="115" y="312" width="570" height="62" rx="3" fill="#c8c0b8" stroke="#a09888"/>

  <g text-anchor="middle">
    <text x="400" y="67" font-size="16" font-weight="bold" fill="#222">Registers</text>
    <text x="400" y="87" font-size="13" fill="#333">nanoseconds</text>
    <text x="400" y="135" font-size="16" font-weight="bold" fill="#222">Cache</text>
    <text x="400" y="155" font-size="13" fill="#333">SRAM on the CPU</text>
    <text x="400" y="203" font-size="16" font-weight="bold" fill="#222">RAM</text>
    <text x="400" y="223" font-size="13" fill="#333">DRAM — tens of nanoseconds</text>
    <text x="400" y="271" font-size="16" font-weight="bold" fill="#222">SSD</text>
    <text x="400" y="291" font-size="13" fill="#333">flash — ~0.1 ms latency</text>
    <text x="400" y="339" font-size="16" font-weight="bold" fill="#222">HDD</text>
    <text x="400" y="359" font-size="13" fill="#333">spinning disk — ~10 ms latency</text>
  </g>

  <!-- left arrow: upward -->
  <line x1="90" y1="370" x2="90" y2="55" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="58" y="205" font-size="15" fill="#333" text-anchor="middle" transform="rotate(-90 58 205)">faster · smaller · costlier per byte</text>

  <!-- right arrow: downward -->
  <line x1="710" y1="55" x2="710" y2="370" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="742" y="205" font-size="15" fill="#333" text-anchor="middle" transform="rotate(90 742 205)">slower · larger · cheaper per byte</text>
</svg>
