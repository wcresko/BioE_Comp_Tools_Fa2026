<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 265" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="265" fill="white"/>

  <!-- codon labels -->
  <text x="291" y="45" text-anchor="middle" font-size="13" fill="#333">ATG</text>
  <text x="378" y="45" text-anchor="middle" font-size="13" fill="#333">first TAG</text>
  <text x="508" y="45" text-anchor="middle" font-size="13" fill="#333">last TAG</text>
  <line x1="291" y1="50" x2="291" y2="64" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="378" y1="50" x2="378" y2="64" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="508" y1="50" x2="508" y2="64" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- the DNA string -->
  <rect x="270" y="66" width="43" height="30" fill="#c8c0b8"/>
  <rect x="356" y="66" width="43" height="30" fill="#c8c0b8"/>
  <rect x="486" y="66" width="43" height="30" fill="#c8c0b8"/>
  <text x="270" y="89" font-family="'Courier New', monospace" font-weight="bold" font-size="24" fill="#333">ATG</text>
  <text x="313" y="89" font-family="'Courier New', monospace" font-weight="bold" font-size="24" fill="#333">GCA</text>
  <text x="356" y="89" font-family="'Courier New', monospace" font-weight="bold" font-size="24" fill="#333">TAG</text>
  <text x="400" y="89" font-family="'Courier New', monospace" font-weight="bold" font-size="24" fill="#333">CCATTG</text>
  <text x="486" y="89" font-family="'Courier New', monospace" font-weight="bold" font-size="24" fill="#333">TAG</text>

  <!-- greedy span: whole string to the LAST TAG -->
  <line x1="270" y1="130" x2="529" y2="130" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="270" y1="118" x2="270" y2="130" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="529" y1="118" x2="529" y2="130" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="270" y="140" width="96" height="26" rx="3" fill="#c0392b" stroke="#922b21"/>
  <text x="318" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="white">ATG.*TAG</text>
  <text x="378" y="158" font-size="13" fill="#333">greedy: as much as possible &#8212; the match runs to the <tspan font-weight="bold">last</tspan> TAG</text>

  <!-- lazy span: stops at the FIRST TAG -->
  <line x1="270" y1="200" x2="399" y2="200" stroke="#2e6da4" stroke-width="2.5"/>
  <line x1="270" y1="188" x2="270" y2="200" stroke="#2e6da4" stroke-width="2.5"/>
  <line x1="399" y1="188" x2="399" y2="200" stroke="#2e6da4" stroke-width="2.5"/>
  <rect x="270" y="210" width="106" height="26" rx="3" fill="#2e6da4" stroke="#1f4e79"/>
  <text x="323" y="228" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="white">ATG.*?TAG</text>
  <text x="388" y="228" font-size="13" fill="#333">lazy: as little as possible &#8212; the match stops at the <tspan font-weight="bold">first</tspan> TAG</text>
</svg>
