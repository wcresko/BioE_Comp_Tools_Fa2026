<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="350" fill="white"/>

  <!-- Layer 2 stacked on Layer 1 -->
  <rect x="70" y="85" width="340" height="95" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="240" y="113" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Layer 2 — per-user environment</text>
  <text x="240" y="140" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">conda env / venv</text>
  <text x="240" y="162" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">R library (~/Rlibs) + renv</text>

  <rect x="40" y="180" width="400" height="110" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="240" y="207" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Layer 1 — Lmod modules</text>
  <text x="240" y="233" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">module load R/4.3.3</text>
  <text x="240" y="253" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">module load cuda/12.4</text>
  <text x="240" y="273" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">module load samtools</text>

  <text x="240" y="322" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">most projects: layers 1 + 2 together</text>

  <!-- structural connector to the container alternative -->
  <line x1="443" y1="188" x2="542" y2="188" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="492" y="178" font-size="13" font-style="italic" fill="#333" text-anchor="middle">or</text>

  <!-- Layer 3: sealed container -->
  <rect x="545" y="85" width="230" height="205" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="660" y="115" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Layer 3 — Apptainer</text>
  <text x="660" y="135" font-size="15" font-weight="bold" fill="white" text-anchor="middle">container</text>
  <text x="660" y="170" font-size="13" fill="white" text-anchor="middle">entire operating system</text>
  <text x="660" y="190" font-size="13" fill="white" text-anchor="middle">plus software stack,</text>
  <text x="660" y="210" font-size="13" fill="white" text-anchor="middle">sealed in one image file:</text>
  <text x="660" y="243" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">tidyverse_4.4.1.sif</text>
  <text x="660" y="272" font-size="13" fill="white" text-anchor="middle">runs unchanged anywhere</text>
</svg>
