<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="310" fill="white"/>

  <!-- the four lines of one record -->
  <text x="25" y="55" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333">@SRR12345.1 NS500126:1:H7TG3BGXY:1:11101:18923:1057</text>
  <text x="25" y="90" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333">NCATGCAGCGTACGGTAATTGGCAGGCATTAGCAGCATCC</text>
  <text x="25" y="125" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333">+</text>
  <text x="25" y="160" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333">#AAAAFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF</text>

  <!-- per-line labels -->
  <line x1="460" y1="50" x2="548" y2="50" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="556" y="55" font-size="13" fill="#333"><tspan font-weight="bold">1</tspan>  header: read ID + run info</text>
  <text x="572" y="71" font-size="13" fill="#333">(starts with <tspan font-family="'Courier New', monospace" font-weight="bold">@</tspan>)</text>
  <line x1="370" y1="85" x2="548" y2="85" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="556" y="90" font-size="13" fill="#333"><tspan font-weight="bold">2</tspan>  sequence (A/C/G/T/N)</text>
  <line x1="45" y1="120" x2="548" y2="120" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="556" y="125" font-size="13" fill="#333"><tspan font-weight="bold">3</tspan>  <tspan font-family="'Courier New', monospace" font-weight="bold">+</tspan> separator</text>
  <line x1="378" y1="155" x2="548" y2="155" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="556" y="155" font-size="13" fill="#333"><tspan font-weight="bold">4</tspan>  quality: one character per base,</text>
  <text x="572" y="171" font-size="13" fill="#333">same length as line 2</text>

  <!-- magnifier lines to zoom strip -->
  <line x1="25" y1="166" x2="25" y2="213" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="76" y1="166" x2="235" y2="213" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- zoom: first six quality characters -->
  <rect x="25" y="215" width="34" height="34" rx="3" fill="#c0392b" stroke="#922b21"/>
  <rect x="60" y="215" width="34" height="34" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="95" y="215" width="34" height="34" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="130" y="215" width="34" height="34" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="165" y="215" width="34" height="34" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="200" y="215" width="34" height="34" rx="3" fill="#2e6da4" stroke="#1f4e79"/>
  <text x="42" y="239" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="white">#</text>
  <text x="77" y="239" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="#333">A</text>
  <text x="112" y="239" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="#333">A</text>
  <text x="147" y="239" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="#333">A</text>
  <text x="182" y="239" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="#333">A</text>
  <text x="217" y="239" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="white">F</text>
  <text x="42" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Q2</text>
  <text x="77" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Q32</text>
  <text x="112" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Q32</text>
  <text x="147" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Q32</text>
  <text x="182" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Q32</text>
  <text x="217" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6da4">Q37</text>

  <!-- Phred explanation -->
  <text x="270" y="225" font-size="13" fill="#333"><tspan font-weight="bold">Phred+33 encoding:</tspan> Q = ASCII code &#8722; 33</text>
  <text x="270" y="249" font-size="13" fill="#333"><tspan font-family="'Courier New', monospace" font-weight="bold" fill="#c0392b">#</tspan> (ASCII 35) &#8594; Q2 &#8212; the <tspan font-family="'Courier New', monospace" font-weight="bold">N</tspan> base is a very low-confidence call</text>
  <text x="270" y="273" font-size="13" fill="#333"><tspan font-family="'Courier New', monospace" font-weight="bold" fill="#2e6da4">F</tspan> (ASCII 70) &#8594; Q37 &#8212; a high-confidence call</text>
</svg>
