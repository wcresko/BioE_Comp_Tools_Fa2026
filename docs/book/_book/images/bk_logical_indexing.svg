<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="320" fill="white"/>

  <!-- Row 1: the vector -->
  <text x="20" y="40" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333">measurements</text>
  <rect x="20" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="46" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">2</text>
  <rect x="76" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="102" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">3</text>
  <rect x="132" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="158" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">4</text>
  <rect x="188" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="214" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">2</text>
  <rect x="244" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="270" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">1</text>
  <rect x="300" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="326" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">2</text>
  <rect x="356" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="382" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">4</text>
  <rect x="412" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="438" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">5</text>
  <rect x="468" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="494" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">10</text>
  <rect x="524" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="550" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">8</text>
  <rect x="580" y="50" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="606" y="74" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">9</text>

  <!-- Row 2: the logical mask -->
  <text x="20" y="128" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333">measurements &gt; 5</text>
  <rect x="20" y="138" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="46" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">FALSE</text>
  <rect x="76" y="138" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="102" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">FALSE</text>
  <rect x="132" y="138" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="158" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">FALSE</text>
  <rect x="188" y="138" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="214" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">FALSE</text>
  <rect x="244" y="138" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="270" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">FALSE</text>
  <rect x="300" y="138" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="326" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">FALSE</text>
  <rect x="356" y="138" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="382" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">FALSE</text>
  <rect x="412" y="138" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="438" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">FALSE</text>
  <rect x="468" y="138" width="52" height="38" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="494" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">TRUE</text>
  <rect x="524" y="138" width="52" height="38" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="550" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">TRUE</text>
  <rect x="580" y="138" width="52" height="38" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="606" y="162" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">TRUE</text>

  <!-- Dashed connectors from TRUE cells to result -->
  <line x1="494" y1="176" x2="494" y2="226" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="550" y1="176" x2="550" y2="226" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="606" y1="176" x2="606" y2="226" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Row 3: the result -->
  <text x="20" y="216" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333">measurements[measurements &gt; 5]</text>
  <rect x="468" y="228" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="494" y="252" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">10</text>
  <rect x="524" y="228" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="550" y="252" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">8</text>
  <rect x="580" y="228" width="52" height="38" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="606" y="252" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">9</text>

  <!-- Side note -->
  <text x="20" y="300" font-size="14" fill="#333">The identical idea works in NumPy: <tspan font-family="'Courier New', monospace" font-weight="bold">x[x &gt; 5]</tspan> keeps the elements of an array where the mask is <tspan font-family="'Courier New', monospace" font-weight="bold">True</tspan>.</text>
</svg>
