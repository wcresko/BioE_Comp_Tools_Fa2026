<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="370" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- upstream -->
  <rect x="290" y="20" width="220" height="65" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="400" y="48" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Original repository</text>
  <text x="400" y="70" font-size="13" fill="#333" text-anchor="middle">on GitHub ("upstream")</text>

  <!-- arrows -->
  <line x1="330" y1="85" x2="140" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="385" y1="85" x2="385" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="415" y1="210" x2="415" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="470" y1="85" x2="660" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- arrow labels -->
  <text x="160" y="130" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">git clone</text>
  <text x="372" y="152" font-size="13" font-weight="bold" fill="#333" text-anchor="end">Fork</text>
  <text x="428" y="152" font-size="13" fill="#333" text-anchor="start">pull request</text>
  <text x="600" y="128" font-size="13" font-weight="bold" fill="#333" text-anchor="start" font-family="'Courier New', monospace">Use this template</text>

  <!-- clone -->
  <rect x="20" y="215" width="230" height="125" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="135" y="243" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Your local clone</text>
  <text x="135" y="268" font-size="13" fill="white" text-anchor="middle">a direct copy, linked</text>
  <text x="135" y="286" font-size="13" fill="white" text-anchor="middle">to the original repo</text>
  <text x="135" y="315" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">git push / git pull</text>

  <!-- fork -->
  <rect x="285" y="215" width="230" height="125" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="400" y="243" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Your fork</text>
  <text x="400" y="268" font-size="13" fill="#333" text-anchor="middle">a copy on your GitHub</text>
  <text x="400" y="286" font-size="13" fill="#333" text-anchor="middle">account; shares history,</text>
  <text x="400" y="304" font-size="13" fill="#333" text-anchor="middle">can open pull requests</text>
  <text x="400" y="322" font-size="13" fill="#333" text-anchor="middle">back upstream</text>

  <!-- template -->
  <rect x="550" y="215" width="230" height="125" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="665" y="243" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Your new repository</text>
  <text x="665" y="268" font-size="13" fill="white" text-anchor="middle">fresh history — starts at</text>
  <text x="665" y="286" font-size="13" fill="white" text-anchor="middle">your first commit; no</text>
  <text x="665" y="304" font-size="13" fill="white" text-anchor="middle">connection to the original,</text>
  <text x="665" y="322" font-size="13" fill="white" text-anchor="middle">no upstream to sync</text>
</svg>
