<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="330" fill="white"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <rect x="165" y="25" width="200" height="32" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="265" y="47" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">bash</text>
  <rect x="380" y="25" width="200" height="32" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="480" y="47" font-size="16" font-weight="bold" fill="white" text-anchor="middle">R</text>
  <rect x="595" y="25" width="200" height="32" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="695" y="47" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Python</text>

  <!-- Row labels -->
  <text x="150" y="98" font-size="14" fill="#333" text-anchor="end">read arguments</text>
  <text x="150" y="158" font-size="14" fill="#333" text-anchor="end">validate input</text>
  <text x="150" y="218" font-size="14" fill="#333" text-anchor="end">count &amp; compute</text>
  <text x="150" y="278" font-size="14" fill="#333" text-anchor="end">report</text>

  <!-- Row guide lines -->
  <line x1="160" y1="93" x2="795" y2="93" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="160" y1="153" x2="795" y2="153" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="160" y1="213" x2="795" y2="213" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="160" y1="273" x2="795" y2="273" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- bash column cells -->
  <rect x="165" y="76" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="265" y="98" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">$1</text>
  <rect x="165" y="136" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="265" y="158" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">test -f "$1"</text>
  <rect x="165" y="196" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="265" y="218" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">grep | tr | wc</text>
  <rect x="165" y="256" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="265" y="278" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">echo</text>

  <!-- R column cells -->
  <rect x="380" y="76" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="480" y="98" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">commandArgs()</text>
  <rect x="380" y="136" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="480" y="158" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">file.exists(input)</text>
  <rect x="380" y="196" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="480" y="218" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">readLines() + grepl()</text>
  <rect x="380" y="256" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="480" y="278" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">cat()</text>

  <!-- Python column cells -->
  <rect x="595" y="76" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="695" y="98" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">sys.argv[1]</text>
  <rect x="595" y="136" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="695" y="158" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">Path.is_file()</text>
  <rect x="595" y="196" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="695" y="218" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">list comprehension</text>
  <rect x="595" y="256" width="200" height="34" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="695" y="278" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">print()</text>

  <!-- Flow arrows within each column -->
  <line x1="265" y1="110" x2="265" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="265" y1="170" x2="265" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="265" y1="230" x2="265" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="110" x2="480" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="170" x2="480" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="230" x2="480" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="695" y1="110" x2="695" y2="134" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="695" y1="170" x2="695" y2="194" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="695" y1="230" x2="695" y2="254" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Message -->
  <text x="400" y="317" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">One program, three vocabularies: the same four stages in every language</text>
</svg>
