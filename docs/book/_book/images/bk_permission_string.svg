<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="400" fill="white"/>

  <!-- character cells for -rwxr-xr-x -->
  <g>
    <rect x="170" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="216" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="262" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="308" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="354" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="400" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="446" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="492" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="538" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
    <rect x="584" y="30" width="46" height="54" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  </g>
  <g font-family="'Courier New', monospace" font-weight="bold" font-size="30" fill="#333" text-anchor="middle">
    <text x="193" y="66">-</text>
    <text x="239" y="66">r</text>
    <text x="285" y="66">w</text>
    <text x="331" y="66">x</text>
    <text x="377" y="66">r</text>
    <text x="423" y="66">-</text>
    <text x="469" y="66">x</text>
    <text x="515" y="66">r</text>
    <text x="561" y="66">-</text>
    <text x="607" y="66">x</text>
  </g>

  <!-- brackets under the four spans -->
  <g stroke="#888" stroke-width="1.5" fill="none">
    <path d="M 173,90 V 97 H 213 V 90"/>
    <path d="M 193,97 V 104"/>
    <path d="M 219,90 V 97 H 351 V 90"/>
    <path d="M 285,97 V 104"/>
    <path d="M 357,90 V 97 H 489 V 90"/>
    <path d="M 423,97 V 104"/>
    <path d="M 495,90 V 97 H 627 V 90"/>
    <path d="M 561,97 V 104"/>
  </g>

  <!-- span headers -->
  <g font-size="16" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="193" y="122">file type</text>
    <text x="285" y="122">owner</text>
    <text x="423" y="122">group</text>
    <text x="561" y="122">others</text>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="285" y="140">(wcresko)</text>
    <text x="423" y="140">(staff)</text>
    <text x="561" y="140">(everyone else)</text>
  </g>

  <!-- expansion stacks -->
  <!-- file type -->
  <g font-size="14">
    <g font-family="'Courier New', monospace" font-weight="bold" fill="#333" text-anchor="middle">
      <text x="160" y="166">-</text>
      <text x="160" y="186">d</text>
      <text x="160" y="206">l</text>
    </g>
    <g fill="#333">
      <text x="170" y="166">regular file</text>
      <text x="170" y="186">directory</text>
      <text x="170" y="206">link</text>
    </g>
  </g>
  <!-- owner triplet: rwx -->
  <g font-size="14">
    <g font-family="'Courier New', monospace" font-weight="bold" fill="#333" text-anchor="middle">
      <text x="262" y="166">r</text>
      <text x="262" y="186">w</text>
      <text x="262" y="206">x</text>
    </g>
    <g fill="#333">
      <text x="272" y="166">read</text>
      <text x="272" y="186">write</text>
      <text x="272" y="206">execute</text>
    </g>
  </g>
  <!-- group triplet: r-x -->
  <g font-size="14">
    <g font-family="'Courier New', monospace" font-weight="bold" fill="#333" text-anchor="middle">
      <text x="400" y="166">r</text>
      <text x="400" y="186">-</text>
      <text x="400" y="206">x</text>
    </g>
    <g fill="#333">
      <text x="410" y="166">read</text>
      <text x="410" y="186">(no write)</text>
      <text x="410" y="206">execute</text>
    </g>
  </g>
  <!-- others triplet: r-x -->
  <g font-size="14">
    <g font-family="'Courier New', monospace" font-weight="bold" fill="#333" text-anchor="middle">
      <text x="538" y="166">r</text>
      <text x="538" y="186">-</text>
      <text x="538" y="206">x</text>
    </g>
    <g fill="#333">
      <text x="548" y="166">read</text>
      <text x="548" y="186">(no write)</text>
      <text x="548" y="206">execute</text>
    </g>
  </g>

  <!-- octal sums -->
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="285" y="240">4 + 2 + 1</text>
    <text x="423" y="240">4 + 0 + 1</text>
    <text x="561" y="240">4 + 0 + 1</text>
  </g>

  <!-- octal digit boxes -->
  <rect x="267" y="258" width="36" height="36" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <rect x="405" y="258" width="36" height="36" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <rect x="543" y="258" width="36" height="36" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <g font-family="'Courier New', monospace" font-weight="bold" font-size="20" fill="white" text-anchor="middle">
    <text x="285" y="283">7</text>
    <text x="423" y="283">5</text>
    <text x="561" y="283">5</text>
  </g>

  <!-- converge to the full octal value -->
  <g stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" fill="none">
    <path d="M 285,294 V 316"/>
    <path d="M 423,294 V 316"/>
    <path d="M 561,294 V 316"/>
    <path d="M 285,316 H 561"/>
    <path d="M 423,316 V 332"/>
  </g>
  <text x="423" y="362" font-family="'Courier New', monospace" font-weight="bold" font-size="28" fill="#333" text-anchor="middle">755</text>
  <text x="423" y="384" font-size="13" fill="#333" text-anchor="middle">the same permissions as one octal value for chmod</text>
</svg>
