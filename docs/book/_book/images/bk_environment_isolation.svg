<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="340" fill="white"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Panel divider -->
  <line x1="400" y1="25" x2="400" y2="315" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- LEFT PANEL: one shared Python -->
  <text x="205" y="45" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">One shared Python</text>

  <rect x="30" y="65" width="160" height="52" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="110" y="87" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Project A</text>
  <text x="110" y="106" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">needs pandas 2.2</text>

  <rect x="220" y="65" width="160" height="52" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="300" y="87" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2024 analysis</text>
  <text x="300" y="106" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">needs pandas 1.5</text>

  <!-- Arrows converging on the one interpreter -->
  <line x1="110" y1="117" x2="175" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="117" x2="235" y2="208" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lightning bolt between the arrows -->
  <polygon points="205,130 193,158 203,158 189,190 213,154 202,154 215,130" fill="#c0392b" stroke="#922b21" stroke-width="1"/>

  <!-- Shared interpreter (red) -->
  <rect x="100" y="212" width="210" height="52" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="205" y="234" font-size="14" font-weight="bold" fill="white" text-anchor="middle">one system Python</text>
  <text x="205" y="253" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">pandas 2.2 or 1.5?</text>

  <text x="205" y="292" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">upgrading for one project</text>
  <text x="205" y="309" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">silently breaks the other</text>

  <!-- RIGHT PANEL: one environment per project -->
  <text x="605" y="45" font-size="16" font-weight="bold" fill="#2e6da4" text-anchor="middle">One environment per project</text>

  <!-- Project A folder -->
  <path d="M 430 70 L 430 62 L 470 62 L 478 70 Z" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="430" y="70" width="160" height="130" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="510" y="94" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">project_A/</text>
  <rect x="445" y="110" width="130" height="74" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="510" y="134" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">.venv/</text>
  <text x="510" y="154" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">python 3.12</text>
  <text x="510" y="174" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">pandas 2.2</text>

  <!-- 2024 analysis folder -->
  <path d="M 620 70 L 620 62 L 660 62 L 668 70 Z" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="620" y="70" width="160" height="130" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="700" y="94" font-family="'Courier New', monospace" font-weight="bold" font-size="14" fill="#333" text-anchor="middle">analysis_2024/</text>
  <rect x="635" y="110" width="130" height="74" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="700" y="134" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">.venv/</text>
  <text x="700" y="154" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">python 3.12</text>
  <text x="700" y="174" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white" text-anchor="middle">pandas 1.5</text>

  <!-- Records -->
  <text x="510" y="224" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">requirements.txt</text>
  <text x="700" y="224" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333" text-anchor="middle">requirements.txt</text>
  <line x1="510" y1="200" x2="510" y2="210" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="700" y1="200" x2="700" y2="210" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="605" y="292" font-size="13" font-weight="bold" fill="#2e6da4" text-anchor="middle">each project pins its own versions;</text>
  <text x="605" y="309" font-size="13" font-weight="bold" fill="#2e6da4" text-anchor="middle">neither can break the other</text>
</svg>
