<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="420" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- A: first run -->
  <rect x="25" y="15" width="220" height="90" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="135" y="40" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">First run:</text>
  <text x="135" y="58" font-size="13" fill="#333" text-anchor="middle">generous but not absurd</text>
  <text x="135" y="80" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">--mem=32G</text>
  <text x="135" y="98" font-size="13" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">--time=04:00:00</text>

  <!-- B: job runs -->
  <rect x="330" y="30" width="150" height="60" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="405" y="66" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">Job runs</text>

  <!-- C: seff -->
  <rect x="563" y="158" width="212" height="72" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="669" y="183" font-size="13" fill="white" text-anchor="middle">when it finishes:</text>
  <text x="669" y="210" font-size="15" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">seff &lt;jobid&gt;</text>

  <!-- D: right-size -->
  <rect x="253" y="290" width="300" height="100" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="403" y="315" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Right-size the next request:</text>
  <text x="403" y="342" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">--mem  = MaxRSS  × 1.2</text>
  <text x="403" y="364" font-size="13" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">--time = Elapsed × 1.2</text>

  <!-- E: resubmit -->
  <rect x="25" y="165" width="216" height="70" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="133" y="193" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Resubmit with the</text>
  <text x="133" y="213" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">right-sized request</text>

  <!-- flow arrows -->
  <line x1="245" y1="60" x2="325" y2="60" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="480,60 668,60 668,153" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="668,230 668,338 558,338" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="253,338 133,338 133,240" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="133,165 133,130 405,130 405,95" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="280" y="122" font-size="13" font-style="italic" fill="#555" text-anchor="middle">second and later runs</text>
  <text x="403" y="262" font-size="13" font-style="italic" fill="#555" text-anchor="middle">the two-submission loop</text>
</svg>
