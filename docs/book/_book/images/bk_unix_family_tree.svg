<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="415" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Unix -->
  <rect x="50" y="150" width="160" height="64" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="130" y="176" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Unix</text>
  <text x="130" y="196" font-size="13" fill="#333" text-anchor="middle">Bell Labs, 1969</text>

  <!-- BSD -->
  <rect x="300" y="46" width="145" height="56" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="372" y="70" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">BSD</text>
  <text x="372" y="90" font-size="13" fill="#333" text-anchor="middle">Berkeley, 1977</text>

  <!-- System V -->
  <rect x="300" y="154" width="145" height="56" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="372" y="178" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">System V</text>
  <text x="372" y="198" font-size="13" fill="#333" text-anchor="middle">commercial Unix</text>

  <!-- Linux -->
  <rect x="300" y="268" width="145" height="56" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="372" y="292" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">Linux</text>
  <text x="372" y="312" font-size="13" fill="#333" text-anchor="middle">1991</text>

  <!-- macOS -->
  <rect x="610" y="46" width="145" height="56" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="682" y="70" font-size="18" font-weight="bold" fill="#222" text-anchor="middle">macOS</text>
  <text x="682" y="90" font-size="13" fill="#333" text-anchor="middle">Apple computers</text>

  <!-- Linux today -->
  <rect x="560" y="248" width="215" height="78" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="667" y="272" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Linux today</text>
  <text x="667" y="294" font-size="13" fill="#333" text-anchor="middle">Android · most cloud servers</text>
  <text x="667" y="314" font-size="13" fill="#333" text-anchor="middle">Talapas · WSL on Windows</text>

  <!-- descent arrows -->
  <line x1="214" y1="160" x2="294" y2="82" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="214" y1="182" x2="294" y2="182" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="449" y1="74" x2="604" y2="74" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="449" y1="296" x2="554" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- dashed inspiration link to Linux -->
  <line x1="214" y1="204" x2="294" y2="288" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
  <text x="150" y="252" font-size="13" font-style="italic" fill="#333" text-anchor="middle">inspired, not derived</text>
  <text x="150" y="270" font-size="13" font-style="italic" fill="#333" text-anchor="middle">(no shared code)</text>

  <!-- message banner -->
  <rect x="185" y="358" width="430" height="38" rx="3" fill="#2e6da4" stroke="#1f4e79"/>
  <text x="400" y="382" font-size="16" font-weight="bold" fill="white" text-anchor="middle">The same commands work everywhere</text>
</svg>
