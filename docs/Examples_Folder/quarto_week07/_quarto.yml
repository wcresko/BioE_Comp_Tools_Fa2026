# This tiny file makes the examples folder a Quarto project of its own.
# Why: without it, rendering one of these examples from INSIDE the course
# repository would inherit the course website's format settings from the
# repo's top-level _quarto.yml (producing a themed HTML page instead of
# slides or a manuscript PDF). With it, each example renders standalone,
# exactly as it does when downloaded on its own. Students who only
# download individual files never need this.
project:
  title: "Week 7 Quarto examples"
