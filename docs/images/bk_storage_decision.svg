<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="330" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- root question -->
  <rect x="300" y="20" width="200" height="50" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="400" y="50" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">What is this file?</text>

  <!-- tree connectors -->
  <line x1="400" y1="70" x2="400" y2="95" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="95" x2="695" y2="95" stroke="#555" stroke-width="1.5"/>
  <line x1="105" y1="95" x2="105" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="295" y1="95" x2="295" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="505" y1="95" x2="505" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="695" y1="95" x2="695" y2="145" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- leaf: code -->
  <rect x="15" y="150" width="180" height="120" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="105" y="176" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Code &amp; scripts</text>
  <text x="105" y="202" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">/home/duckid</text>
  <text x="105" y="226" font-size="13" fill="#333" text-anchor="middle">and in a Git repo</text>
  <text x="105" y="246" font-size="13" fill="#333" text-anchor="middle">(an off-cluster copy)</text>

  <!-- leaf: scratch (highlight) -->
  <rect x="205" y="150" width="180" height="120" fill="#c0392b" stroke="#922b21" rx="3"/>
  <text x="295" y="176" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Large active data</text>
  <text x="295" y="202" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">/scratch/&lt;PIRG&gt;/</text>
  <text x="295" y="226" font-size="13" fill="white" text-anchor="middle">untouched for 90 days</text>
  <text x="295" y="246" font-size="13" fill="white" text-anchor="middle">= purged, no warning</text>

  <!-- leaf: projects -->
  <rect x="415" y="150" width="180" height="120" fill="#2e6da4" stroke="#1f4e79" rx="3"/>
  <text x="505" y="176" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Results to keep</text>
  <text x="505" y="202" font-size="14" font-weight="bold" fill="white" text-anchor="middle" font-family="'Courier New', monospace">/projects/&lt;PIRG&gt;/</text>
  <text x="505" y="226" font-size="13" fill="white" text-anchor="middle">copy results here</text>
  <text x="505" y="246" font-size="13" fill="white" text-anchor="middle">when a run finishes</text>

  <!-- leaf: home -->
  <rect x="605" y="150" width="180" height="120" fill="#c8c0b8" stroke="#a09888" rx="3"/>
  <text x="695" y="176" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">Small configs &amp;</text>
  <text x="695" y="194" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">software installs</text>
  <text x="695" y="222" font-size="14" font-weight="bold" fill="#333" text-anchor="middle" font-family="'Courier New', monospace">/home/duckid</text>
  <text x="695" y="246" font-size="13" fill="#333" text-anchor="middle">250 GB quota</text>

  <text x="400" y="305" font-size="13" font-style="italic" fill="#333" text-anchor="middle">Nothing on Talapas is backed up — keep irreplaceable data somewhere off the cluster.</text>
</svg>
