<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Helvetica, Arial, sans-serif">
<rect width="1200" height="300" fill="white"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="25" y="110" width="165" height="70" rx="8" fill="#e3f2fd" stroke="#333" stroke-width="1.5"/>
<text x="107.5" y="136.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#111">Describe the goal</text>
<text x="107.5" y="154.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#111">precisely</text>
<line x1="190" y1="145.0" x2="218" y2="145.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="220" y="110" width="165" height="70" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="302.5" y="136.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#111">Get code</text>
<text x="302.5" y="154.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#111">from the assistant</text>
<line x1="385" y1="145.0" x2="413" y2="145.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="415" y="110" width="165" height="70" rx="8" fill="#ffa07a" stroke="#333" stroke-width="1.5"/>
<text x="497.5" y="136.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#111">READ it</text>
<text x="497.5" y="154.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#111">every line</text>
<line x1="580" y1="145.0" x2="608" y2="145.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="610" y="110" width="165" height="70" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
<text x="692.5" y="136.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#111">Run it on a</text>
<text x="692.5" y="154.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#111">tiny test</text>
<line x1="775" y1="145.0" x2="803" y2="145.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="805" y="110" width="165" height="70" rx="8" fill="#f9d71c" stroke="#333" stroke-width="1.5"/>
<text x="887.5" y="136.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#111">Check against</text>
<text x="887.5" y="154.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#111">something you know</text>
<line x1="970" y1="145.0" x2="998" y2="145.0" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="984.0" y="127.0" text-anchor="middle" font-size="12" fill="#2e8b57">right</text>
<rect x="1000" y="110" width="165" height="70" rx="8" fill="#98fb98" stroke="#333" stroke-width="1.5"/>
<text x="1082.5" y="136.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="bold" fill="#111">Use it, and</text>
<text x="1082.5" y="154.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="normal" fill="#111">keep the test</text>
<path d="M887.5,180 C887.5,270 107.5,270 107.5,182" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="497.5" y="262" text-anchor="middle" font-size="13" fill="#c0392b">wrong: paste the exact error or output back, say what you expected, go around again</text>
<text x="600.0" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#2c3e50">The productive loop</text>
<text x="600.0" y="70" text-anchor="middle" font-size="13" fill="#666">The two steps people skip - reading the code and checking the result - are the ones that matter</text>
</svg>