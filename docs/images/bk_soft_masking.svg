<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="300" fill="white"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- band label -->
  <text x="448" y="32" text-anchor="middle" font-size="13" fill="#333">soft-masked repeat (lowercase)</text>
  <line x1="448" y1="37" x2="448" y2="52" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- first grep command box -->
  <rect x="25" y="54" width="150" height="32" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="100" y="75" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">grep "GAATTC"</text>
  <line x1="177" y1="70" x2="236" y2="70" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- sequence 1: soft-masked -->
  <rect x="386" y="54" width="125" height="22" fill="#c8c0b8" stroke="#a09888"/>
  <rect x="290" y="54" width="58" height="22" rx="3" fill="#c0392b" stroke="#922b21"/>
  <text x="242" y="70" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333">TTACG</text>
  <text x="290" y="70" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="white">GAATTC</text>
  <text x="348" y="70" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333">CGTA</text>
  <text x="386" y="70" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333">cca</text>
  <text x="415" y="70" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#c0392b">gaattc</text>
  <text x="473" y="70" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333">gtta</text>
  <text x="511" y="70" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333">ACGGT</text>

  <!-- verdicts for sequence 1 -->
  <line x1="319" y1="78" x2="319" y2="88" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="444" y1="78" x2="444" y2="88" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="300" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6da4">&#10003;</text><text x="310" y="103" font-size="14" fill="#333">found</text>
  <text x="422" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">&#10007;</text><text x="432" y="103" font-size="14" fill="#333">missed</text>

  <!-- the fix -->
  <path d="M400,118 L400,158" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <rect x="425" y="123" width="160" height="30" rx="3" fill="#2e6da4" stroke="#1f4e79"/>
  <text x="505" y="143" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="white">tr 'acgt' 'ACGT'</text>

  <!-- second grep command box -->
  <rect x="25" y="174" width="150" height="32" rx="3" fill="#c8c0b8" stroke="#a09888"/>
  <text x="100" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="13" fill="#333">grep "GAATTC"</text>
  <line x1="177" y1="190" x2="236" y2="190" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- sequence 2: uppercased -->
  <rect x="386" y="174" width="125" height="22" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="290" y="174" width="58" height="22" rx="3" fill="#c0392b" stroke="#922b21"/>
  <rect x="415" y="174" width="58" height="22" rx="3" fill="#c0392b" stroke="#922b21"/>
  <text x="242" y="190" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333">TTACG</text>
  <text x="290" y="190" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="white">GAATTC</text>
  <text x="348" y="190" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333">CGTACCA</text>
  <text x="415" y="190" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="white">GAATTC</text>
  <text x="473" y="190" font-family="'Courier New', monospace" font-weight="bold" font-size="16" fill="#333">GTTAACGGT</text>

  <!-- verdicts for sequence 2 -->
  <line x1="319" y1="198" x2="319" y2="208" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="444" y1="198" x2="444" y2="208" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="300" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6da4">&#10003;</text><text x="310" y="223" font-size="14" fill="#333">found</text>
  <text x="422" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6da4">&#10003;</text><text x="432" y="223" font-size="14" fill="#333">found</text>

  <!-- bottom note -->
  <text x="400" y="262" text-anchor="middle" font-size="14" fill="#333">Uppercasing first lets grep see the site inside the masked repeat too.</text>
</svg>
