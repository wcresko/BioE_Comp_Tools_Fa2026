# ============================================================
# EXAMPLE 3 - A personal academic website as a Quarto project
# BioE Computational Tools 2026, Week 7
#
# This file turns the folder into a *project*: every .qmd here is
# one page of the site, and this file supplies the shared pieces
# (navigation bar, theme, footer).
#
# Work with it from the terminal, run *inside this folder*:
#   quarto preview      # live local preview, re-renders on save
#   quarto render       # writes the finished site into docs/
#
# In Week 10 we put this on the real web: push the folder to a
# GitHub repository and switch on GitHub Pages, serving from the
# docs/ folder on main - that is why output-dir is set to docs.
# ============================================================
project:
  type: website
  output-dir: docs

website:
  title: "Avery Rivers"
  description: "PhD student in bioengineering, University of Oregon"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - research.qmd
      - publications.qmd
      - cv.qmd
    right:
      - icon: github
        href: https://github.com/your-username
      - icon: envelope
        href: mailto:arivers@uoregon.edu
  page-footer:
    left: "© 2026 Avery Rivers"
    right: "Made with [Quarto](https://quarto.org)"

format:
  html:
    theme: flatly          # try: cosmo, litera, sandstone, zephyr ...
    css: styles.css
    toc: true
