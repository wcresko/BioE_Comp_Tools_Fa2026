project:
  type: book
  output-dir: _book   # copied to ../docs/book by ../render_book.R

book:
  title: "Foundational Computational Tools for Bioengineers"
  subtitle: "A Practical Guide to Unix, R, Python, and Scientific Computing"
  author: "William A. Cresko"
  date: today
  date-format: "MMMM D, YYYY"
  description: |
    A comprehensive guide to essential computational tools for graduate students 
    in bioengineering and life sciences, covering Unix/Linux, R and Python, editors and IDEs,
    computing resources at the University of Oregon, AI-assisted coding, reproducible
    documents, version control with Git/GitHub, and high-performance computing.
  
  chapters:
    - index.qmd
    - chapters/01-introduction.qmd
    - chapters/02-your-toolkit.qmd
    - chapters/03-computing-at-uo.qmd
    - chapters/04-computer-systems.qmd
    - chapters/05-unix-fundamentals.qmd
    - chapters/06-files-pipes.qmd
    - chapters/07-grep-regex.qmd
    - chapters/08-shell-scripting.qmd
    - chapters/09-r-programming.qmd
    - chapters/10-python-programming.qmd
    - chapters/11-tidy-data.qmd
    - chapters/12-data-visualization.qmd
    - chapters/13-writing-functions.qmd
    - chapters/14-parallel-computing.qmd
    - chapters/15-databases.qmd
    - chapters/16-quarto-documents.qmd
    - chapters/17-latex-basics.qmd
    - chapters/18-ai-assisted-coding.qmd
    - chapters/19-git-github.qmd
    - chapters/20-hpc-talapas.qmd
    - references.qmd
  
  appendices:
    - chapters/appendix-A-unix.qmd
    - chapters/appendix-B-git.qmd
    - chapters/appendix-C-r.qmd
    - chapters/appendix-D-python.qmd
    - chapters/appendix-E-latex.qmd
    - chapters/appendix-F-slurm.qmd
    - chapters/appendix-G-regex.qmd
    - chapters/appendix-H-shortcuts.qmd
    - chapters/appendix-I-data-formats.qmd
    - chapters/appendix-J-glossary.qmd
  
  page-navigation: true
  search: true
  repo-url: https://github.com/wcresko/BioE_Comp_Tools_Fa2026
  repo-subdir: Book
  repo-actions: [edit, issue]
  
  sidebar:
    style: docked
    background: light
    collapse-level: 1
    
  page-footer:
    left: |
      © 2026 William A. Cresko | Knight Campus for Accelerating Scientific Impact
    right: |
      [Course website](https://wcresko.github.io/BioE_Comp_Tools_Fa2026/) | Built with [Quarto](https://quarto.org/)

bibliography: references.bib
csl: apa.csl

format:
  html:
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, custom.scss]
    code-copy: true
    code-overflow: wrap
    code-line-numbers: true
    code-annotations: hover
    code-link: true
    highlight-style: github
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    link-external-icon: true
    link-external-newwindow: true
    fig-cap-location: bottom
    tbl-cap-location: top
    df-print: kable

  pdf:
    documentclass: scrbook
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
    include-in-header:
      - text: |
          \usepackage{fancyhdr}
          \usepackage{listings}
          \lstset{basicstyle=\ttfamily\small, breaklines=true}
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    citecolor: blue

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

crossref:
  chapters: true
  fig-prefix: "Figure"
  tbl-prefix: "Table"
  eq-prefix: "Equation"
  sec-prefix: "Section"
  lst-prefix: "Listing"

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true
    fig.align: center
    fig.width: 8
    fig.height: 6
    out.width: "100%"
